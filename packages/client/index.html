<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fast and minimalist Javascript Playground. Write & run your code online with live console. Great for experiment & learning."
    />
    <title>Node.js Playground</title>
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h1>Node.js Playground<span> — Write & run Javascript code</span></h1>
        <a href="https://github.com/abednego-s/javascript-playground">Github</a>
      </div>

      <div class="container">
        <div class="resizable-container" id="resizableContainer">
          <div class="panel panel-left" id="leftPanel">
            <div id="code-editor"></div>
          </div>
          <div class="resizer" id="resizer"></div>
          <div class="panel panel-right" id="rightPanel">
            <div id="output"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
